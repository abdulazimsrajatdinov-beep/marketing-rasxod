<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marketing rasxodları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--sf:#fff;--ln:#E3E6EB;--tx:#14181F;--mu:#5E6673;--ac:#1F5EFF;--ac2:#E8EEFF;--ok:#127A4B;--okb:#E3F4EB;--bad:#B42318;--badb:#FDECEA;--warn:#9A5B00;--warnb:#FFF4E0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sp{flex:1}
.month{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px}
.month button{border:0;background:transparent;width:40px;height:40px;border-radius:9px;cursor:pointer;font-size:18px}
.month button:hover{background:var(--bg)}
.month b{min-width:130px;text-align:center;font-weight:600}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 18px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px}
.total{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;background:#14181F;color:#fff;border:0;margin-bottom:16px}
.total .lbl{color:#AEB6C4;font-size:13px}.total .v{font-size:34px;font-weight:700;letter-spacing:-.02em}
.mu{color:var(--mu);font-size:13px}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.hint{margin:0 0 12px}
/* grid table */
.tw{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow-x:auto;margin-bottom:16px}
table.g{width:100%;border-collapse:collapse;min-width:980px}
.g th,.g td{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
.g th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:#FAFBFC}
.g th:first-child,.g td:first-child{text-align:left;padding-left:16px;position:sticky;left:0;background:inherit;z-index:1}
.g tbody tr{background:#fff}.g thead tr,.g tfoot tr{background:#FAFBFC}
.g td.bn{font-weight:600}
.g input{width:112px;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;text-align:right;font-size:15px;background:#fff;transition:border-color .15s,background .3s}
.g input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.g input.saving{background:#F3F6FF}.g input.saved{background:var(--okb);border-color:#9FD4B8}.g input.fail{background:var(--badb);border-color:var(--bad)}
.g td.tot{font-weight:700}
.g tfoot td{font-weight:700;border-bottom:0}
.g .lim{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.g .lim a{color:var(--ac);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.w{background:var(--warnb);color:var(--warn)}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-bottom:10px;font-size:14px}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
dialog{border:0;border-radius:20px;padding:0;width:min(460px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,24,31,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}.dlg h3{margin:0;font-size:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
label.f input{border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--tx);font-weight:400}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;margin:0}
.login{max-width:360px;margin:12vh auto}.login .card{display:flex;flex-direction:column;gap:14px;padding:24px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#14181F;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.share{display:flex;flex-direction:column;gap:10px}
.share .s{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;flex-wrap:wrap}.share .s b{flex:1;min-width:140px}
/* phone: each branch becomes a card */
@media(max-width:760px){
 .tw{background:transparent;border:0;overflow:visible}
 table.g{min-width:0}.g thead{display:none}
 .g tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
 .g td{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:0;padding:0;text-align:left;position:static!important}
 .g td::before{content:attr(data-l);font-size:12px;color:var(--mu);font-weight:600}
 .g td.bn{grid-column:1/-1;font-size:17px}.g td.bn::before{display:none}
 .g td.tot,.g td.lc{grid-column:span 1}
 .g input{width:100%}
 .g .lim{align-items:flex-start}
 .g tfoot{display:block}.g tfoot tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#14181F;color:#fff;border-radius:16px;padding:14px}
 .g tfoot td::before{color:#AEB6C4}.g tfoot td.bn{grid-column:1/-1}
 .month b{min-width:110px}.top h1{font-size:19px}
}
/* report */
.rep{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.rep header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--tx);padding-bottom:14px;margin-bottom:18px}
.rep h1{margin:0;font-size:24px}.rep .sub{color:var(--mu);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpis div{border:1px solid var(--ln);border-radius:12px;padding:12px 14px;background:#fff}.kpis span{display:block;color:var(--mu);font-size:12px}.kpis b{font-size:20px}
table.r{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.r th,.r td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}.r th:first-child,.r td:first-child{text-align:left}
.r th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.r tfoot td{font-weight:700;border-top:2px solid var(--tx)}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;margin-bottom:18px}
.rep h2{margin:22px 0 10px}
@media print{body{background:#fff}.noprint{display:none!important}.tblw{border:0}.rep{padding:0;max-width:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="bdg"><form method="dialog" class="dlg" id="bf">
  <h3>Aylıq limit</h3><p class="mu" id="bfT" style="margin:0"></p>
  <label class="f">Limit (sum)<input name="amount" inputmode="numeric" placeholder="Limit qoymaw ushın bos qaldırıń"></label>
  <div class="acts"><button type="button" class="btn sec" id="bfX">Biykar etiw</button><button class="btn">Saqlaw</button></div>
</form></dialog>

<dialog id="shd"><div class="dlg">
  <h3>Básshıǵa jiberiw</h3>
  <p class="mu" style="margin:0" id="shM"></p>
  <div class="share" id="shL"></div>
  <p class="mu" style="margin:0">Siltemeni ashqan adam tek esabattı kóredi, hesh nárseni ózgerte almaydı.</p>
  <div class="acts"><button type="button" class="btn sec" id="shX">Jabıw</button></div>
</div></dialog>

<script>
const SB="https://rgqruifzceraivheepdv.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_gBRWWzLrDY4KDpgPtlk2sg_sTFOxECS";
const CATS=["Mobilograf","Brendfeys","Operator","SMM","Bloger","Target"];
const MON=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const num=s=>+String(s||"").replace(/\D/g,"")||0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const mname=m=>{const[y,mm]=m.split("-");return MON[+mm-1]+" "+y};
const shift=(m,k)=>{const[y,mm]=m.split("-").map(Number);return ym(new Date(y,mm-1+k,1))};
async function rpc(fn,args){const r=await fetch(SB+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok){const t=await r.text();throw new Error(t.includes("denied")?"denied":"net")}const t=await r.text();return t?JSON.parse(t):null}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
function matrix(cells){const M={};cells.forEach(c=>{(M[c.branch]=M[c.branch]||{})[c.cat]=+c.amount});return M}
const rowSum=(M,b)=>Object.values(M[b]||{}).reduce((a,v)=>a+v,0);
const colSum=(M,c)=>Object.values(M).reduce((a,r)=>a+(r[c]||0),0);

let code=null;try{code=localStorage.getItem("mr_code")}catch(e){}
let month=ym(new Date()),D=null,M={};
const P=new URLSearchParams(location.search);
if(P.get("r"))report(P.get("r"),P.get("m")||month);else if(code)load();else login();

function login(err){
  $("#app").innerHTML=`<div class="wrap"><div class="login"><h1 style="font-size:22px">Marketing rasxodları</h1>
  <form class="card" id="lf"><label class="f">Kiriw kodı<input name="c" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" required></label>
  ${err?'<p class="err">Kod nadurıs. Qaytadan kiritiń.</p>':''}<button class="btn">Kiriw</button></form></div></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();code=e.target.c.value.trim().toUpperCase();try{localStorage.setItem("mr_code",code)}catch(x){}load()};
}
async function load(){
  try{D=await rpc("mr_data",{p_code:code,p_month:month});M=matrix(D.cells);render()}
  catch(e){if(e.message==="denied"){try{localStorage.removeItem("mr_code")}catch(x){}login(true)}else{$("#app").innerHTML='<div class="wrap"><p class="mu">Internet baylanısın tekseriń hám betti jańalań.</p></div>'}}
}
function limitCell(b){const s=rowSum(M,b.id),bu=+(D.budgets[b.id]||0),p=bu?Math.round(s/bu*100):0;
  return `<div class="lim">${bu?(s>bu?'<span class="pill bad">Asqan · '+p+'%</span>':'<span class="pill '+(p>85?'w':'ok')+'">'+p+'%</span>'):''}
  <span class="mu">${bu?fmt(bu):"Limit joq"}</span><a href="#" data-bud="${b.id}">Ózgertiw</a></div>`}
function render(){
  const T=D.branches.reduce((a,b)=>a+rowSum(M,b.id),0),budT=Object.values(D.budgets).reduce((a,v)=>a+ +v,0);
  $("#app").innerHTML=`<div class="wrap">
  <div class="top"><h1>Marketing rasxodları</h1><span class="sp"></span>
   <div class="month"><button aria-label="Aldıńǵı ay" id="mp">‹</button><b>${mname(month)}</b><button aria-label="Keyingi ay" id="mn">›</button></div>
   <button class="btn sec" id="sh">Básshıǵa jiberiw</button></div>
  <div class="card total"><div><div class="lbl">Barlıq filiallar · ${mname(month)}</div><div class="v" id="gt">${fmt(T)} sum</div></div>
   <div class="lbl">${budT?"Limitler jámi: "+fmt(budT)+" sum":"Limit qoyılmaǵan"}</div></div>
  <p class="mu hint">Summanı kerekli katakqa jazıń: ol avtomat saqlanadı (katak jasıl bolıp janadı). Óshiriw ushın katakty bos qaldırıń.</p>
  <div class="tw"><table class="g"><thead><tr><th>Filial</th>${CATS.map(c=>`<th>${c}</th>`).join("")}<th>Jámi</th><th>Limit</th></tr></thead>
  <tbody>${D.branches.map(b=>`<tr><td class="bn">${esc(b.name)}</td>
    ${CATS.map(c=>`<td data-l="${c}"><input inputmode="numeric" aria-label="${esc(b.name)} · ${c}" data-b="${b.id}" data-c="${c}" value="${M[b.id]&&M[b.id][c]?fmt(M[b.id][c]):""}" placeholder="0"></td>`).join("")}
    <td class="tot" data-l="Jámi" id="rt-${b.id}">${fmt(rowSum(M,b.id))}</td><td class="lc" data-l="Limit" id="lc-${b.id}">${limitCell(b)}</td></tr>`).join("")}</tbody>
  <tfoot><tr><td class="bn">Jámi</td>${CATS.map(c=>`<td data-l="${c}" id="ct-${c}">${fmt(colSum(M,c))}</td>`).join("")}<td data-l="Barlıǵı" id="ct-all">${fmt(T)}</td><td></td></tr></tfoot></table></div>
  <div class="card" id="cats"></div></div>`;
  drawCats();
  $("#mp").onclick=()=>{month=shift(month,-1);load()};$("#mn").onclick=()=>{month=shift(month,1);load()};$("#sh").onclick=openShare;
  document.querySelectorAll(".g input").forEach(inp=>{
    inp.addEventListener("input",()=>{const d=inp.value.replace(/\D/g,"");inp.value=d?fmt(+d):""});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}});
    inp.addEventListener("change",()=>save(inp));
  });
  bindBud();
}
function bindBud(){document.querySelectorAll("[data-bud]").forEach(a=>a.onclick=ev=>{ev.preventDefault();openBud(a.dataset.bud)})}
function drawCats(){const T=CATS.reduce((a,c)=>a+colSum(M,c),0);
  $("#cats").innerHTML=`<h2>Rasxod túrleri boyınsha · barlıq filiallar</h2>`+(T?CATS.map(c=>[c,colSum(M,c)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="cat"><span>${c}</span><b>${fmt(v)} · ${Math.round(v/T*100)}%</b><div class="bar"><i style="width:${v/T*100}%"></i></div></div>`).join(""):'<p class="mu" style="margin:0">Bul ayda ele summa kiritilmegen.</p>')}
function refreshTotals(){D.branches.forEach(b=>{$("#rt-"+b.id).textContent=fmt(rowSum(M,b.id));$("#lc-"+b.id).innerHTML=limitCell(b)});
  CATS.forEach(c=>$("#ct-"+c).textContent=fmt(colSum(M,c)));const T=D.branches.reduce((a,b)=>a+rowSum(M,b.id),0);
  $("#ct-all").textContent=fmt(T);$("#gt").textContent=fmt(T)+" sum";drawCats();bindBud()}
async function save(inp){const b=inp.dataset.b,c=inp.dataset.c,v=num(inp.value);
  inp.classList.remove("saved","fail");inp.classList.add("saving");
  try{await rpc("mr_set_cell",{p_code:code,p_branch:b,p_month:month,p_cat:c,p_amount:v});
    M[b]=M[b]||{};if(v)M[b][c]=v;else delete M[b][c];inp.classList.remove("saving");inp.classList.add("saved");setTimeout(()=>inp.classList.remove("saved"),1200);refreshTotals()}
  catch(e){inp.classList.remove("saving");inp.classList.add("fail");toast("Saqlanbadı. Internetti tekseriń.")}}
let budB=null;
function openBud(id){budB=id;const b=D.branches.find(x=>x.id===id);$("#bfT").textContent=b.name+" · "+mname(month);$("#bf").amount.value=D.budgets[id]?fmt(D.budgets[id]):"";$("#bdg").showModal()}
$("#bfX").onclick=()=>$("#bdg").close();
$("#bf").amount.addEventListener("input",e=>{const d=e.target.value.replace(/\D/g,"");e.target.value=d?fmt(+d):""});
$("#bf").onsubmit=async e=>{e.preventDefault();const v=num(e.target.amount.value);try{await rpc("mr_budget",{p_code:code,p_branch:budB,p_month:month,p_amount:v});
  if(v)D.budgets[budB]=v;else delete D.budgets[budB];$("#bdg").close();toast("Limit saqlandı");render()}catch(x){toast("Saqlanbadı")}};
function openShare(){
  const base=location.origin+location.pathname;
  const items=[{n:"Barlıq filiallar (ulıwma esabat)",t:D.all_token},...D.branches.map(b=>({n:b.name,t:b.token}))];
  $("#shM").textContent=mname(month)+" esabatı. Filialdı tańlap, siltemesin kóshiriń yamasa Telegram arqalı jiberiń.";
  $("#shL").innerHTML=items.map(it=>{const u=base+"?r="+encodeURIComponent(it.t)+"&m="+month;const txt=it.n+" · marketing rasxodları · "+mname(month);
    return `<div class="s"><b>${esc(it.n)}</b><button class="btn sec sm" data-cp="${esc(u)}">Kóshiriw</button><a class="btn sm" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(txt)}">Telegram</a></div>`}).join("");
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.cp);toast("Silteme kóshirildi")}catch(e){prompt("Siltemeni kóshiriń:",b.dataset.cp)}});
  $("#shd").showModal()}
$("#shX").onclick=()=>$("#shd").close();

async function report(tok,m){
  $("#app").innerHTML='<div class="rep"><p class="mu">Júklenip atır…</p></div>';
  let R;try{R=await rpc("mr_report",{p_token:tok,p_month:m})}catch(e){$("#app").innerHTML='<div class="rep"><p>Esabat tabılmadı yamasa silteme nadurıs.</p></div>';return}
  const RM=matrix(R.cells),all=R.scope==="all",bn=Object.fromEntries(R.branches.map(b=>[b.id,b.name]));
  const T=R.branches.reduce((a,b)=>a+rowSum(RM,b.id),0),budT=Object.values(R.budgets).reduce((a,v)=>a+ +v,0);
  const spB=Object.keys(R.budgets).reduce((a,k)=>a+rowSum(RM,k),0);
  const nav=k=>location.search="?r="+encodeURIComponent(tok)+"&m="+shift(m,k);
  const body=all
   ?`<h2>Filiallar hám rasxod túrleri</h2><div class="tblw"><table class="r"><thead><tr><th>Filial</th>${CATS.map(c=>`<th>${c}</th>`).join("")}<th>Jámi</th><th>Limit</th></tr></thead><tbody>
     ${R.branches.map(b=>{const s=rowSum(RM,b.id),bu=+(R.budgets[b.id]||0);return `<tr><td>${esc(b.name)}</td>${CATS.map(c=>`<td>${RM[b.id]&&RM[b.id][c]?fmt(RM[b.id][c]):"—"}</td>`).join("")}<td><b>${fmt(s)}</b></td><td>${bu?fmt(bu)+" ("+Math.round(s/bu*100)+"%)":"—"}</td></tr>`}).join("")}
     </tbody><tfoot><tr><td>Jámi</td>${CATS.map(c=>`<td>${fmt(colSum(RM,c))}</td>`).join("")}<td>${fmt(T)}</td><td>${budT?fmt(budT):"—"}</td></tr></tfoot></table></div>`
   :`<h2>Rasxod túrleri</h2><div class="tblw"><table class="r"><thead><tr><th>Túri</th><th>Summa</th><th>Úlesi</th></tr></thead><tbody>
     ${CATS.map(c=>{const v=(RM[R.scope]||{})[c]||0;return `<tr><td>${c}</td><td>${v?fmt(v):"—"}</td><td>${v&&T?Math.round(v/T*100)+"%":"—"}</td></tr>`}).join("")}
     </tbody><tfoot><tr><td>Jámi</td><td>${fmt(T)} sum</td><td></td></tr></tfoot></table></div>`;
  $("#app").innerHTML=`<div class="rep"><header><div><h1>Marketing rasxodları · ${all?"Barlıq filiallar":esc(bn[R.scope])}</h1>
   <div class="sub">${mname(m)} esabatı · tayarlanǵan sáne ${new Date().toLocaleDateString("ru-RU")}</div></div>
   <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><div class="month"><button id="rp" aria-label="Aldıńǵı ay">‹</button><b>${mname(m)}</b><button id="rn" aria-label="Keyingi ay">›</button></div>
   <button class="btn" onclick="window.print()">PDF / Basıp shıǵarıw</button></div></header>
  <div class="kpis"><div><span>Jumsalǵan</span><b>${fmt(T)} sum</b></div>
   <div><span>Limit</span><b>${budT?fmt(budT)+" sum":"—"}</b></div>
   <div><span>${budT?(spB>budT?"Limitten asqanı":"Limitten qaldıq"):"Eń kóp rasxod"}</span><b>${budT?fmt(Math.abs(budT-spB))+" sum":(T?CATS.map(c=>[c,all?colSum(RM,c):((RM[R.scope]||{})[c]||0)]).sort((a,b)=>b[1]-a[1])[0][0]:"—")}</b></div></div>
  ${body}</div>`;

}
