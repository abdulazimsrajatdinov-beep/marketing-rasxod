<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marketing rasxodları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F3F1EC;--sf:#fff;--ln:#E7E2D8;--tx:#1A1714;--mu:#6F675C;--ac:#1E3A34;--ac2:#E3EEE9;--gold:#C8A15A;--ok:#1E7A4F;--okb:#E2F3EA;--bad:#B4321F;--badb:#FCE9E5;--warn:#9A6200;--warnb:#FFF2DB;
--c1:#6C5CE7;--c2:#E17055;--c3:#00A3A3;--c4:#E84393;--c5:#F39C12;--c6:#2D7FF9;--sh:0 1px 2px rgba(26,23,20,.04),0 8px 24px -12px rgba(26,23,20,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Manrope",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:280px;background:linear-gradient(160deg,#1E3A34 0%,#2C5247 55%,#3B6B5C 100%);z-index:-1}
button,input{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;color:#fff}
.top h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.top h1 .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#E7C98A,#C8A15A);display:grid;place-items:center;color:#1E3A34;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sp{flex:1}
.month{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px;backdrop-filter:blur(8px)}
.month button{border:0;background:transparent;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:20px;color:#fff}
.month button:hover{background:rgba(255,255,255,.15)}
.month b{min-width:130px;text-align:center;font-weight:700;color:#fff}
.btn{border:0;border-radius:14px;min-height:46px;padding:0 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#E7C98A,#C8A15A);color:#1E3A34;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 8px 20px -8px rgba(200,161,90,.8);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:11px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.total{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:0;padding:0;overflow:hidden;margin-bottom:16px;border:0}
.total>div{padding:20px 22px}.total>div+div{border-left:1px solid var(--ln)}
.total .lbl{color:var(--mu);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.total .v{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.total .v small{font-size:16px;color:var(--mu);font-weight:600;margin-left:4px}
.total .s{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.total .s2{font-size:13px;color:var(--mu);margin-top:2px}
.mu{color:var(--mu);font-size:13px}
h2{font-size:16px;margin:0 0 14px;font-weight:800;letter-spacing:-.01em}
.hint{margin:0 0 12px;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--ln);border-radius:12px;padding:10px 14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:4px;flex:none}
.tw{background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow-x:auto;margin-bottom:16px;box-shadow:var(--sh)}
table.g{width:100%;border-collapse:separate;border-spacing:0;min-width:960px}
.g th,.g td{padding:12px 6px;border-bottom:1px solid #F0ECE4;text-align:right;white-space:nowrap}
.g th{font-size:11.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:#FBFAF7;padding-top:14px;padding-bottom:14px}
.g th .h{display:inline-flex;align-items:center;gap:6px}
.g th:first-child,.g td:first-child{text-align:left;padding-left:20px;position:sticky;left:0;background:inherit;z-index:1}
.g th:last-child,.g td:last-child{padding-right:20px}
.g tbody tr{background:#fff;transition:background .15s}.g tbody tr:hover{background:#FCFBF8}
.g thead tr,.g tfoot tr{background:#FBFAF7}
.g td.bn{font-weight:700}
.g td.bn .bw{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.g input{width:100px;border:1.5px solid transparent;border-radius:11px;padding:10px 11px;text-align:right;font-size:15px;font-weight:600;background:#F6F4EF;transition:border-color .15s,background .3s,box-shadow .15s}
.g input::placeholder{color:#B9B1A4;font-weight:500}
.g input:hover{border-color:var(--ln)}
.g input:focus{outline:0;border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px var(--ac2)}
.g input.saving{background:#EEF3F1}.g input.saved{background:var(--okb);border-color:#8FD0AE}.g input.fail{background:var(--badb);border-color:var(--bad)}
.g td.tot{font-weight:800;font-size:16px}
.g tfoot td{font-weight:800;border-bottom:0;background:#1E3A34;color:#fff}
.g tfoot td:first-child{background:#1E3A34}
.g .lim{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:104px}
.g .lim a{color:var(--ac);font-size:12.5px;font-weight:700;text-decoration:none;border-bottom:1px dashed currentColor}
.lbar{width:104px;height:6px;border-radius:99px;background:#EFEBE3;overflow:hidden}.lbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.lbar i.w{background:var(--warn)}.lbar i.bad{background:var(--bad)}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.w{background:var(--warnb);color:var(--warn)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#EFEBE3;margin-bottom:16px}
.stack i{display:block;height:100%}
.cat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0ECE4;font-size:14px}.cat:last-child{border-bottom:0}
.cat b{margin-left:auto;font-weight:800}.cat .pc{color:var(--mu);font-size:12.5px;width:42px;text-align:right}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0ECE4;font-size:14px}.rank:last-child{border-bottom:0}
.rank .bb{flex:1;height:8px;border-radius:99px;background:#EFEBE3;overflow:hidden}.rank .bb i{display:block;height:100%;border-radius:99px}
.rank b{width:110px;text-align:right;font-weight:800}
dialog{border:0;border-radius:22px;padding:0;width:min(460px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,30,27,.5);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}.dlg h3{margin:0;font-size:19px;font-weight:800}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mu)}
label.f input{border:1.5px solid var(--ln);border-radius:12px;padding:12px;font-size:16px;color:var(--tx);font-weight:500}
label.f input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;margin:0}
.login{max-width:380px;margin:14vh auto;color:#fff}.login h1{display:flex;align-items:center;gap:10px}
.login .card{display:flex;flex-direction:column;gap:14px;padding:24px;color:var(--tx)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1E3A34;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.share{display:flex;flex-direction:column;gap:10px}
.share .s{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:14px;padding:10px 12px;flex-wrap:wrap}.share .s b{flex:1;min-width:140px}
@media(max-width:860px){.total{grid-template-columns:1fr 1fr}.total>div:first-child{grid-column:1/-1}.total>div+div{border-left:0;border-top:1px solid var(--ln)}.total>div:nth-child(3){border-left:1px solid var(--ln)}.total>div:nth-child(4){grid-column:1/-1}}
@media(max-width:760px){
 .tw{background:transparent;border:0;overflow:visible;box-shadow:none}
 table.g{min-width:0}.g thead{display:none}
 .g tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
 .g td{display:flex;flex-direction:column;align-items:stretch;gap:5px;border:0;padding:0;text-align:left;position:static!important;background:transparent}
 .g td::before{content:attr(data-l);font-size:12px;color:var(--mu);font-weight:700}
 .g td.bn{grid-column:1/-1;font-size:17px}.g td.bn::before{display:none}
 .g input{width:100%}
 .g .lim{align-items:flex-start}.lbar{width:100%}
 .g tfoot{display:block}.g tfoot tr{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#1E3A34;color:#fff;border-radius:20px;padding:16px}
 .g tfoot td,.g tfoot td:first-child{background:transparent}.g tfoot td::before{color:#A9C2B9}.g tfoot td.bn{grid-column:1/-1}
 .month b{min-width:110px}.top h1{font-size:20px}
}
body.rp::before{display:none}
body.rp .month{background:#fff;border-color:var(--ln);backdrop-filter:none}body.rp .month button,body.rp .month b{color:var(--tx)}body.rp .month button:hover{background:var(--bg)}
.rep header{border-bottom:3px solid var(--gold)!important}.rep h1{font-weight:800;letter-spacing:-.02em}
.r tfoot td{background:#1E3A34;color:#fff;border-top:0!important}.tblw{box-shadow:var(--sh);border-radius:16px!important}
@media print{.r tfoot td{background:#fff!important;color:#000!important;border-top:2px solid #000!important}}
/* report */
.rep{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.rep header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--tx);padding-bottom:14px;margin-bottom:18px}
.rep h1{margin:0;font-size:24px}.rep .sub{color:var(--mu);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpis div{border:1px solid var(--ln);border-radius:12px;padding:12px 14px;background:#fff}.kpis span{display:block;color:var(--mu);font-size:12px}.kpis b{font-size:20px}
table.r{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.r th,.r td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}.r th:first-child,.r td:first-child{text-align:left}
.r th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.r tfoot td{font-weight:700;border-top:2px solid var(--tx)}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;margin-bottom:18px}
.rep h2{margin:22px 0 10px}
@media print{body{background:#fff}.noprint{display:none!important}.tblw{border:0}.rep{padding:0;max-width:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="bdg"><form method="dialog" class="dlg" id="bf">
  <h3>Aylıq limit</h3><p class="mu" id="bfT" style="margin:0"></p>
  <label class="f">Limit (sum)<input name="amount" inputmode="numeric" placeholder="Limit qoymaw ushın bos qaldırıń"></label>
  <div class="acts"><button type="button" class="btn sec" id="bfX">Biykar etiw</button><button class="btn">Saqlaw</button></div>
</form></dialog>

<dialog id="shd"><div class="dlg">
  <h3>Básshıǵa jiberiw</h3>
  <p class="mu" style="margin:0" id="shM"></p>
  <div class="share" id="shL"></div>
  <p class="mu" style="margin:0">Siltemeni ashqan adam tek esabattı kóredi, hesh nárseni ózgerte almaydı.</p>
  <div class="acts"><button type="button" class="btn sec" id="shX">Jabıw</button></div>
</div></dialog>

<script>
const SB="https://rgqruifzceraivheepdv.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_gBRWWzLrDY4KDpgPtlk2sg_sTFOxECS";
const CATS=["Mobilograf","Brendfeys","Operator","SMM","Bloger","Target"];
const CC={Mobilograf:"var(--c1)",Brendfeys:"var(--c2)",Operator:"var(--c3)",SMM:"var(--c4)",Bloger:"var(--c5)",Target:"var(--c6)"};
const BC=["#1E3A34","#7A5C1E","#2D7FF9","#B4321F","#6C5CE7","#00897B"];
const MON=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const num=s=>+String(s||"").replace(/\D/g,"")||0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const mname=m=>{const[y,mm]=m.split("-");return MON[+mm-1]+" "+y};
const shift=(m,k)=>{const[y,mm]=m.split("-").map(Number);return ym(new Date(y,mm-1+k,1))};
async function rpc(fn,args){const r=await fetch(SB+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok){const t=await r.text();throw new Error(t.includes("denied")?"denied":"net")}const t=await r.text();return t?JSON.parse(t):null}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
function matrix(cells){const M={};cells.forEach(c=>{(M[c.branch]=M[c.branch]||{})[c.cat]=+c.amount});return M}
const rowSum=(M,b)=>Object.values(M[b]||{}).reduce((a,v)=>a+v,0);
const colSum=(M,c)=>Object.values(M).reduce((a,r)=>a+(r[c]||0),0);

let code=null;try{code=localStorage.getItem("mr_code")}catch(e){}
let month=ym(new Date()),D=null,M={};
const P=new URLSearchParams(location.search);
if(P.get("r"))report(P.get("r"),P.get("m")||month);else if(code)load();else login();

function login(err){
  $("#app").innerHTML=`<div class="wrap"><div class="login"><h1 style="font-size:22px"><span class="lg" aria-hidden="true" style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#E7C98A,#C8A15A);display:grid;place-items:center;color:#1E3A34"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E3A34" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg></span>Marketing rasxodları</h1>
  <form class="card" id="lf"><label class="f">Kiriw kodı<input name="c" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" required></label>
  ${err?'<p class="err">Kod nadurıs. Qaytadan kiritiń.</p>':''}<button class="btn">Kiriw</button></form></div></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();code=e.target.c.value.trim().toUpperCase();try{localStorage.setItem("mr_code",code)}catch(x){}load()};
}
async function load(){
  try{D=await rpc("mr_data",{p_code:code,p_month:month});M=matrix(D.cells);render()}
  catch(e){if(e.message==="denied"){try{localStorage.removeItem("mr_code")}catch(x){}login(true)}else{$("#app").innerHTML='<div class="wrap"><p class="mu">Internet baylanısın tekseriń hám betti jańalań.</p></div>'}}
}
function limitCell(b){const s=rowSum(M,b.id),bu=+(D.budgets[b.id]||0),p=bu?Math.round(s/bu*100):0;
  const k=s>bu?"bad":(p>85?"w":"ok");
  return `<div class="lim">${bu?`<span class="pill ${k}">${s>bu?"Asqan · ":""}${p}%</span><div class="lbar"><i class="${k}" style="width:${Math.min(100,p)}%"></i></div>`:''}
  <span class="mu">${bu?"Limit "+fmt(bu):"Limit joq"}</span><a href="#" data-bud="${b.id}">${bu?"Ózgertiw":"Limit qoyıw"}</a></div>`}
function render(){
  const T=D.branches.reduce((a,b)=>a+rowSum(M,b.id),0),budT=Object.values(D.budgets).reduce((a,v)=>a+ +v,0);
  $("#app").innerHTML=`<div class="wrap">
  <div class="top"><h1><span class="lg" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E3A34" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg></span>Marketing rasxodları</h1><span class="sp"></span>
   <div class="month"><button aria-label="Aldıńǵı ay" id="mp">‹</button><b>${mname(month)}</b><button aria-label="Keyingi ay" id="mn">›</button></div>
   <button class="btn sec" id="sh">Básshıǵa jiberiw</button></div>
  <div class="card total" id="kp"></div>
  <p class="mu hint"><span class="dot" style="background:var(--ok)"></span>Summanı katakqa jazıp Enter basıń: ol avtomat saqlanadı. Óshiriw ushın katakty bos qaldırıń.</p>
  <div class="tw"><table class="g"><thead><tr><th>Filial</th>${CATS.map(c=>`<th><span class="h"><span class="dot" style="background:${CC[c]}"></span>${c}</span></th>`).join("")}<th>Jámi</th><th>Limit</th></tr></thead>
  <tbody>${D.branches.map((b,i)=>`<tr><td class="bn"><span class="bw"><span class="av" style="background:${BC[i%6]}" aria-hidden="true">${esc(b.name[0])}</span>${esc(b.name)}</span></td>
    ${CATS.map(c=>`<td data-l="${c}"><input inputmode="numeric" aria-label="${esc(b.name)} · ${c}" data-b="${b.id}" data-c="${c}" value="${M[b.id]&&M[b.id][c]?fmt(M[b.id][c]):""}" placeholder="0"></td>`).join("")}
    <td class="tot" data-l="Jámi" id="rt-${b.id}">${fmt(rowSum(M,b.id))}</td><td class="lc" data-l="Limit" id="lc-${b.id}">${limitCell(b)}</td></tr>`).join("")}</tbody>
  <tfoot><tr><td class="bn">Jámi</td>${CATS.map(c=>`<td data-l="${c}" id="ct-${c}">${fmt(colSum(M,c))}</td>`).join("")}<td data-l="Barlıǵı" id="ct-all">${fmt(T)}</td><td></td></tr></tfoot></table></div>
  <div class="cats"><div class="card" id="cats"></div><div class="card" id="rank"></div></div></div>`;
  drawCats();
  $("#mp").onclick=()=>{month=shift(month,-1);load()};$("#mn").onclick=()=>{month=shift(month,1);load()};$("#sh").onclick=openShare;
  document.querySelectorAll(".g input").forEach(inp=>{
    inp.addEventListener("input",()=>{const d=inp.value.replace(/\D/g,"");inp.value=d?fmt(+d):""});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}});
    inp.addEventListener("change",()=>save(inp));
  });
  bindBud();
}
function bindBud(){document.querySelectorAll("[data-bud]").forEach(a=>a.onclick=ev=>{ev.preventDefault();openBud(a.dataset.bud)})}
function drawCats(){const T=CATS.reduce((a,c)=>a+colSum(M,c),0),cs=CATS.map(c=>[c,colSum(M,c)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  $("#cats").innerHTML=`<h2>Rasxod túrleri boyınsha</h2>`+(T?`<div class="stack">${cs.map(([c,v])=>`<i style="width:${v/T*100}%;background:${CC[c]}" title="${c}"></i>`).join("")}</div>`+cs.map(([c,v])=>`<div class="cat"><span class="dot" style="background:${CC[c]}"></span><span>${c}</span><b>${fmt(v)}</b><span class="pc">${Math.round(v/T*100)}%</span></div>`).join(""):'<p class="mu" style="margin:0">Bul ayda ele summa kiritilmegen.</p>');
  const rs=D.branches.map((b,i)=>[b,rowSum(M,b.id),i]).sort((a,b)=>b[1]-a[1]),mx=rs[0][1]||1;
  $("#rank").innerHTML=`<h2>Filiallar reytingi</h2>`+rs.map(([b,v,i])=>`<div class="rank"><span class="av" style="background:${BC[i%6]};width:28px;height:28px;font-size:12px;border-radius:9px" aria-hidden="true">${esc(b.name[0])}</span><span style="width:96px">${esc(b.name)}</span><span class="bb"><i style="width:${v/mx*100}%;background:${BC[i%6]}"></i></span><b>${fmt(v)}</b></div>`).join("");
  const T2=D.branches.reduce((a,b)=>a+rowSum(M,b.id),0),budT=Object.values(D.budgets).reduce((a,v)=>a+ +v,0),top=cs[0],tb=rs[0];
  $("#kp").innerHTML=`<div><div class="lbl">Barlıq filiallar · ${mname(month)}</div><div class="v">${fmt(T2)}<small>sum</small></div></div>
   <div><div class="lbl">Limitler</div><div class="s">${budT?fmt(budT):"—"}</div><div class="s2">${budT?"limit qoyılǵan filiallar":"limit qoyılmaǵan"}</div></div>
   <div><div class="lbl">Eń kóp jumsaǵan</div><div class="s">${T2?esc(tb[0].name):"—"}</div><div class="s2">${T2?fmt(tb[1])+" sum":""}</div></div>
   <div><div class="lbl">Eń úlken rasxod</div><div class="s">${top?top[0]:"—"}</div><div class="s2">${top?Math.round(top[1]/T*100)+"% ulıwma summadan":""}</div></div>`}
function refreshTotals(){D.branches.forEach(b=>{$("#rt-"+b.id).textContent=fmt(rowSum(M,b.id));$("#lc-"+b.id).innerHTML=limitCell(b)});
  CATS.forEach(c=>$("#ct-"+c).textContent=fmt(colSum(M,c)));const T=D.branches.reduce((a,b)=>a+rowSum(M,b.id),0);
  $("#ct-all").textContent=fmt(T);drawCats();bindBud()}
async function save(inp){const b=inp.dataset.b,c=inp.dataset.c,v=num(inp.value);
  inp.classList.remove("saved","fail");inp.classList.add("saving");
  try{await rpc("mr_set_cell",{p_code:code,p_branch:b,p_month:month,p_cat:c,p_amount:v});
    M[b]=M[b]||{};if(v)M[b][c]=v;else delete M[b][c];inp.classList.remove("saving");inp.classList.add("saved");setTimeout(()=>inp.classList.remove("saved"),1200);refreshTotals()}
  catch(e){inp.classList.remove("saving");inp.classList.add("fail");toast("Saqlanbadı. Internetti tekseriń.")}}
let budB=null;
function openBud(id){budB=id;const b=D.branches.find(x=>x.id===id);$("#bfT").textContent=b.name+" · "+mname(month);$("#bf").amount.value=D.budgets[id]?fmt(D.budgets[id]):"";$("#bdg").showModal()}
$("#bfX").onclick=()=>$("#bdg").close();
$("#bf").amount.addEventListener("input",e=>{const d=e.target.value.replace(/\D/g,"");e.target.value=d?fmt(+d):""});
$("#bf").onsubmit=async e=>{e.preventDefault();const v=num(e.target.amount.value);try{await rpc("mr_budget",{p_code:code,p_branch:budB,p_month:month,p_amount:v});
  if(v)D.budgets[budB]=v;else delete D.budgets[budB];$("#bdg").close();toast("Limit saqlandı");render()}catch(x){toast("Saqlanbadı")}};
function openShare(){
  const base=location.origin+location.pathname;
  const items=[{n:"Barlıq filiallar (ulıwma esabat)",t:D.all_token},...D.branches.map(b=>({n:b.name,t:b.token}))];
  $("#shM").textContent=mname(month)+" esabatı. Filialdı tańlap, siltemesin kóshiriń yamasa Telegram arqalı jiberiń.";
  $("#shL").innerHTML=items.map(it=>{const u=base+"?r="+encodeURIComponent(it.t)+"&m="+month;const txt=it.n+" · marketing rasxodları · "+mname(month);
    return `<div class="s"><b>${esc(it.n)}</b><button class="btn sec sm" data-cp="${esc(u)}">Kóshiriw</button><a class="btn sm" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(txt)}">Telegram</a></div>`}).join("");
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.cp);toast("Silteme kóshirildi")}catch(e){prompt("Siltemeni kóshiriń:",b.dataset.cp)}});
  $("#shd").showModal()}
$("#shX").onclick=()=>$("#shd").close();

async function report(tok,m){
  document.body.classList.add('rp');
  $("#app").innerHTML='<div class="rep"><p class="mu">Júklenip atır…</p></div>';
  let R;try{R=await rpc("mr_report",{p_token:tok,p_month:m})}catch(e){$("#app").innerHTML='<div class="rep"><p>Esabat tabılmadı yamasa silteme nadurıs.</p></div>';return}
  const RM=matrix(R.cells),all=R.scope==="all",bn=Object.fromEntries(R.branches.map(b=>[b.id,b.name]));
  const T=R.branches.reduce((a,b)=>a+rowSum(RM,b.id),0),budT=Object.values(R.budgets).reduce((a,v)=>a+ +v,0);
  const spB=Object.keys(R.budgets).reduce((a,k)=>a+rowSum(RM,k),0);
  const nav=k=>location.search="?r="+encodeURIComponent(tok)+"&m="+shift(m,k);
  const body=all
   ?`<h2>Filiallar hám rasxod túrleri</h2><div class="tblw"><table class="r"><thead><tr><th>Filial</th>${CATS.map(c=>`<th>${c}</th>`).join("")}<th>Jámi</th><th>Limit</th></tr></thead><tbody>
     ${R.branches.map(b=>{const s=rowSum(RM,b.id),bu=+(R.budgets[b.id]||0);return `<tr><td>${esc(b.name)}</td>${CATS.map(c=>`<td>${RM[b.id]&&RM[b.id][c]?fmt(RM[b.id][c]):"—"}</td>`).join("")}<td><b>${fmt(s)}</b></td><td>${bu?fmt(bu)+" ("+Math.round(s/bu*100)+"%)":"—"}</td></tr>`}).join("")}
     </tbody><tfoot><tr><td>Jámi</td>${CATS.map(c=>`<td>${fmt(colSum(RM,c))}</td>`).join("")}<td>${fmt(T)}</td><td>${budT?fmt(budT):"—"}</td></tr></tfoot></table></div>`
   :`<h2>Rasxod túrleri</h2><div class="tblw"><table class="r"><thead><tr><th>Túri</th><th>Summa</th><th>Úlesi</th></tr></thead><tbody>
     ${CATS.map(c=>{const v=(RM[R.scope]||{})[c]||0;return `<tr><td>${c}</td><td>${v?fmt(v):"—"}</td><td>${v&&T?Math.round(v/T*100)+"%":"—"}</td></tr>`}).join("")}
     </tbody><tfoot><tr><td>Jámi</td><td>${fmt(T)} sum</td><td></td></tr></tfoot></table></div>`;
  $("#app").innerHTML=`<div class="rep"><header><div><h1>Marketing rasxodları · ${all?"Barlıq filiallar":esc(bn[R.scope])}</h1>
   <div class="sub">${mname(m)} esabatı · tayarlanǵan sáne ${new Date().toLocaleDateString("ru-RU")}</div></div>
   <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><div class="month"><button id="rp" aria-label="Aldıńǵı ay">‹</button><b>${mname(m)}</b><button id="rn" aria-label="Keyingi ay">›</button></div>
   <button class="btn" onclick="window.print()">PDF / Basıp shıǵarıw</button></div></header>
  <div class="kpis"><div><span>Jumsalǵan</span><b>${fmt(T)} sum</b></div>
   <div><span>Limit</span><b>${budT?fmt(budT)+" sum":"—"}</b></div>
   <div><span>${budT?(spB>budT?"Limitten asqanı":"Limitten qaldıq"):"Eń kóp rasxod"}</span><b>${budT?fmt(Math.abs(budT-spB))+" sum":(T?CATS.map(c=>[c,all?colSum(RM,c):((RM[R.scope]||{})[c]||0)]).sort((a,b)=>b[1]-a[1])[0][0]:"—")}</b></div></div>
  ${body}</div>`;
  $("#rp").onclick=()=>nav(-1);$("#rn").onclick=()=>nav(1);
}
</script>
</body>
</html>
