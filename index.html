<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marketing rasxodları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--sf:#fff;--ln:#E3E6EB;--tx:#14181F;--mu:#5E6673;--ac:#1F5EFF;--ac2:#E8EEFF;--ok:#127A4B;--okb:#E3F4EB;--bad:#B42318;--badb:#FDECEA;--warn:#9A5B00;--warnb:#FFF4E0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sp{flex:1}
.month{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px}
.month button{border:0;background:transparent;width:40px;height:40px;border-radius:9px;cursor:pointer;font-size:18px}
.month button:hover{background:var(--bg)}
.month b{min-width:130px;text-align:center;font-weight:600}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 18px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--badb);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px}
.total{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;background:#14181F;color:#fff;border:0}
.total .lbl{color:#AEB6C4;font-size:13px}.total .v{font-size:34px;font-weight:700;letter-spacing:-.02em}
.br{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.br:hover{border-color:#B9C4D6}
.br.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac2)}
.br .n{font-weight:600}.br .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.bar i.over{background:var(--bad)}
.mu{color:var(--mu);font-size:13px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-bottom:10px;font-size:14px}
.cat .bar{grid-column:1/-1;height:6px}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.lh h2{margin:0;flex:1}
.it{display:grid;grid-template-columns:86px 1fr auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--ln);align-items:center;cursor:pointer}
.it:hover{background:#FAFBFC}.it:last-child{border-bottom:0}
.it .d{color:var(--mu);font-size:13px}.it .a{font-weight:700;text-align:right;white-space:nowrap}
.it .t{min-width:0}.it .t b{font-weight:600}.it .t div{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:#1640B8;font-weight:600;margin-right:6px}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}
.fab{position:fixed;right:18px;bottom:18px;box-shadow:0 10px 30px rgba(31,94,255,.35);min-height:54px;border-radius:16px;font-size:16px}
dialog{border:0;border-radius:20px;padding:0;width:min(460px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,24,31,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
label.f input,label.f select,label.f textarea{border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--tx);background:#fff;font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.acts .l{margin-right:auto}
.err{color:var(--bad);font-size:14px;margin:0}
.login{max-width:360px;margin:12vh auto;text-align:center}
.login .card{display:flex;flex-direction:column;gap:14px;padding:24px;text-align:left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14181F;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.share{display:flex;flex-direction:column;gap:10px}
.share .s{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.share .s b{flex:1}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.w{background:var(--warnb);color:var(--warn)}
/* report */
.rep{max-width:820px;margin:0 auto;padding:28px 18px 60px}
.rep header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--tx);padding-bottom:14px;margin-bottom:18px}
.rep h1{margin:0;font-size:24px}.rep .sub{color:var(--mu);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpis div{border:1px solid var(--ln);border-radius:12px;padding:12px 14px;background:#fff}.kpis span{display:block;color:var(--mu);font-size:12px}.kpis b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln)}th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}tfoot td{font-weight:700;border-top:2px solid var(--tx)}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;margin-bottom:18px}
.rep h2{margin:22px 0 10px}
@media print{body{background:#fff}.noprint{display:none!important}.tblw{border:0}.rep{padding:0}}
@media(max-width:520px){.it{grid-template-columns:1fr auto}.it .d{grid-column:1/-1}.month b{min-width:110px}.top h1{font-size:19px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg"><form method="dialog" class="dlg" id="fm">
  <h3 id="fmT">Rasxod qosıw</h3>
  <label class="f">Filial<select name="branch" required></select></label>
  <label class="f">Rasxod túri<select name="cat" required></select></label>
  <div class="two">
    <label class="f">Summa (sum)<input name="amount" inputmode="numeric" required placeholder="500 000"></label>
    <label class="f">Sáne<input name="date" type="date" required></label>
  </div>
  <label class="f">Eskertiw<textarea name="note" rows="2" placeholder="Mısalı: Instagram target, 7 kún"></textarea></label>
  <p class="err" id="fmE" hidden></p>
  <div class="acts"><button type="button" class="btn danger sm l" id="fmDel" hidden>Óshiriw</button>
  <button type="button" class="btn sec" id="fmX">Biykar etiw</button><button class="btn" id="fmS">Saqlaw</button></div>
</form></dialog>

<dialog id="bdg"><form method="dialog" class="dlg" id="bf">
  <h3>Aylıq limit</h3><p class="mu" id="bfT" style="margin:0"></p>
  <label class="f">Limit (sum)<input name="amount" inputmode="numeric" placeholder="Limit qoymaw ushın bos qaldırıń"></label>
  <div class="acts"><button type="button" class="btn sec" id="bfX">Biykar etiw</button><button class="btn">Saqlaw</button></div>
</form></dialog>

<dialog id="shd"><div class="dlg">
  <h3>Básshıǵa jiberiw</h3>
  <p class="mu" style="margin:0" id="shM"></p>
  <div class="share" id="shL"></div>
  <p class="mu" style="margin:0">Siltemeni ashqan adam tek esabattı kóredi, hesh nárseni ózgerte almaydı.</p>
  <div class="acts"><button type="button" class="btn sec" id="shX">Jabıw</button></div>
</div></dialog>

<script>
const SB="https://rgqruifzceraivheepdv.supabase.co/rest/v1/rpc/";
const KEY="sb_publishable_gBRWWzLrDY4KDpgPtlk2sg_sTFOxECS";
const CATS=["Target reklama (Instagram/Facebook)","Bloger","Foto-video","Baspa (banner, listovka)","Tarqatpa / promo-aksiya","Sawǵalar / merch","Basqa"];
const MON=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const mname=m=>{const[y,mm]=m.split("-");return MON[+mm-1]+" "+y};
const shift=(m,k)=>{const[y,mm]=m.split("-").map(Number);return ym(new Date(y,mm-1+k,1))};
const fdate=s=>{const[y,m,d]=s.split("-");return d+"."+m};
async function rpc(fn,args){const r=await fetch(SB+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok){const t=await r.text();throw new Error(t.includes("denied")?"denied":"net")}const t=await r.text();return t?JSON.parse(t):null}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
let code=null;try{code=localStorage.getItem("mr_code")}catch(e){}
let month=ym(new Date()),D=null,sel="all";

const P=new URLSearchParams(location.search);
if(P.get("r"))report(P.get("r"),P.get("m")||month);else if(code)load();else login();

function login(err){
  $("#app").innerHTML=`<div class="wrap"><div class="login"><h1 style="font-size:22px">Marketing rasxodları</h1>
  <form class="card" id="lf"><label class="f">Kiriw kodı<input name="c" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" required></label>
  ${err?'<p class="err">Kod nadurıs. Qaytadan kiritiń.</p>':''}<button class="btn">Kiriw</button></form></div></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();code=e.target.c.value.trim().toUpperCase();try{localStorage.setItem("mr_code",code)}catch(x){}load()};
}
async function load(){
  try{D=await rpc("mr_data",{p_code:code,p_month:month});render()}
  catch(e){if(e.message==="denied"){try{localStorage.removeItem("mr_code")}catch(x){}login(true)}else{$("#app").innerHTML='<div class="wrap"><p class="empty">Internet baylanısın tekseriń hám betti jańalań.</p></div>'}}
}
function sums(exp){const by={},cat={};let t=0;exp.forEach(x=>{by[x.branch]=(by[x.branch]||0)+ +x.amount;cat[x.cat]=(cat[x.cat]||0)+ +x.amount;t+= +x.amount});return{by,cat,t}}
function render(){
  const ex=D.expenses,{by,t}=sums(ex),bn=Object.fromEntries(D.branches.map(b=>[b.id,b.name]));
  const shown=sel==="all"?ex:ex.filter(x=>x.branch===sel);
  const cs=sums(shown).cat,ct=Object.values(cs).reduce((a,b)=>a+b,0);
  const budT=Object.values(D.budgets).reduce((a,b)=>a+ +b,0),spB=Object.keys(D.budgets).reduce((a,k)=>a+(by[k]||0),0);
  $("#app").innerHTML=`<div class="wrap">
  <div class="top"><h1>Marketing rasxodları</h1><span class="sp"></span>
   <div class="month"><button aria-label="Aldıńǵı ay" id="mp">‹</button><b>${mname(month)}</b><button aria-label="Keyingi ay" id="mn">›</button></div>
   <button class="btn sec" id="sh">Básshıǵa jiberiw</button></div>
  <div class="grid">
   <div class="card total"><div><div class="lbl">Barlıq filiallar · ${mname(month)}</div><div class="v">${fmt(t)} sum</div></div>
    <div class="lbl">${budT?`Limit: ${fmt(budT)} sum · limitli filiallarda ${Math.round(spB/budT*100)}% jumsaldı`:"Limit qoyılmaǵan"}</div></div>
   ${D.branches.map(b=>{const s=by[b.id]||0,bu=+(D.budgets[b.id]||0),p=bu?Math.min(100,s/bu*100):0,over=bu&&s>bu;
     return `<div class="card br ${sel===b.id?"on":""}" data-b="${b.id}" tabindex="0" role="button" aria-pressed="${sel===b.id}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="n">${esc(b.name)}</span>
      ${bu?(over?'<span class="pill bad">Limitten asqan</span>':(p>85?'<span class="pill w">'+Math.round(p)+'%</span>':'<span class="pill ok">'+Math.round(p)+'%</span>')):""}</div>
      <div class="v">${fmt(s)} <span class="mu">sum</span></div>
      ${bu?`<div class="bar"><i class="${over?"over":""}" style="width:${p}%"></i></div>`:""}
      <div class="mu" style="display:flex;justify-content:space-between"><span>${bu?"Limit "+fmt(bu):"Limit joq"}</span><a href="#" data-bud="${b.id}" style="color:var(--ac)">Limit</a></div></div>`}).join("")}
  </div>
  <div class="row2"><div class="card"><h2>Rasxod túrleri · ${sel==="all"?"barlıq filiallar":esc(bn[sel])}</h2>
   ${ct?Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><b>${fmt(v)}</b><div class="bar"><i style="width:${v/ct*100}%"></i></div></div>`).join(""):'<p class="mu" style="margin:0">Bul ayda rasxod joq.</p>'}</div></div>
  <div class="list"><div class="lh"><h2>${sel==="all"?"Barlıq rasxodlar":esc(bn[sel])+" rasxodları"} · ${shown.length}</h2>
   ${sel!=="all"?'<button class="btn sec sm" id="clr">Barlıq filiallar</button>':""}</div>
   ${shown.length?shown.map(x=>`<div class="it" data-id="${x.id}" tabindex="0" role="button"><div class="d">${fdate(x.spent_on)}</div>
    <div class="t"><b><span class="chip">${esc(bn[x.branch])}</span>${esc(x.cat)}</b><div>${esc(x.note||"")}</div></div><div class="a">${fmt(x.amount)}</div></div>`).join("")
   :'<p class="empty">Bul ayda ele rasxod qosılmaǵan. Tómendegi „+ Rasxod“ túymesin basıń.</p>'}
  </div></div>
  <button class="btn fab" id="add">+ Rasxod</button>`;
  $("#mp").onclick=()=>{month=shift(month,-1);load()};$("#mn").onclick=()=>{month=shift(month,1);load()};
  document.querySelectorAll(".br").forEach(e=>{const f=()=>{sel=sel===e.dataset.b?"all":e.dataset.b;render()};e.onclick=ev=>{if(ev.target.closest("[data-bud]"))return;f()};e.onkeydown=ev=>{if(ev.key==="Enter")f()}});
  document.querySelectorAll("[data-bud]").forEach(a=>a.onclick=ev=>{ev.preventDefault();ev.stopPropagation();openBud(a.dataset.bud)});
  document.querySelectorAll(".it").forEach(e=>{e.onclick=()=>openForm(D.expenses.find(x=>x.id==e.dataset.id));e.onkeydown=ev=>{if(ev.key==="Enter")e.click()}});
  $("#add").onclick=()=>openForm(null);$("#sh").onclick=openShare;if($("#clr"))$("#clr").onclick=()=>{sel="all";render()};
}
let editing=null;
function openForm(x){
  editing=x;const f=$("#fm");$("#fmT").textContent=x?"Rasxodtı ózgertiw":"Rasxod qosıw";$("#fmE").hidden=true;$("#fmDel").hidden=!x;
  f.branch.innerHTML=D.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
  const cats=CATS.slice();if(x&&!cats.includes(x.cat))cats.push(x.cat);f.cat.innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join("");
  f.branch.value=x?x.branch:(sel!=="all"?sel:D.branches[0].id);f.cat.value=x?x.cat:CATS[0];
  f.amount.value=x?fmt(x.amount):"";f.note.value=x?x.note||"":"";
  const today=new Date().toISOString().slice(0,10);f.date.value=x?x.spent_on:(today.slice(0,7)===month?today:month+"-01");
  $("#dlg").showModal();setTimeout(()=>f.amount.focus(),50);
}
$("#fmX").onclick=()=>$("#dlg").close();
$("#fm").onsubmit=async e=>{e.preventDefault();const f=e.target,amt=+f.amount.value.replace(/\D/g,"");
  if(!amt){$("#fmE").textContent="Summanı jazıń.";$("#fmE").hidden=false;return}
  $("#fmS").disabled=true;
  try{const a={p_code:code,p_branch:f.branch.value,p_cat:f.cat.value,p_amount:amt,p_date:f.date.value,p_note:f.note.value.trim()};
    if(editing)await rpc("mr_update",{p_id:editing.id,...a});else await rpc("mr_add",a);
    $("#dlg").close();toast(editing?"Ózgertildi":"Qosıldı");month=f.date.value.slice(0,7);await load()}
  catch(x){$("#fmE").textContent="Saqlanbadı. Internetti tekseriń.";$("#fmE").hidden=false}
  $("#fmS").disabled=false};
$("#fm").amount.addEventListener("input",e=>{const d=e.target.value.replace(/\D/g,"");e.target.value=d?fmt(+d):""});
$("#fmDel").onclick=async()=>{if(!editing)return;const b=$("#fmDel");if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Anıq óshiriw?";setTimeout(()=>{b.dataset.c="";b.textContent="Óshiriw"},3000);return}
  try{await rpc("mr_del",{p_code:code,p_id:editing.id});$("#dlg").close();toast("Óshirildi");load()}catch(x){toast("Óshirilmedi")}b.dataset.c="";b.textContent="Óshiriw"};
let budB=null;
function openBud(id){budB=id;const b=D.branches.find(x=>x.id===id);$("#bfT").textContent=b.name+" · "+mname(month);$("#bf").amount.value=D.budgets[id]?fmt(D.budgets[id]):"";$("#bdg").showModal()}
$("#bfX").onclick=()=>$("#bdg").close();
$("#bf").amount.addEventListener("input",e=>{const d=e.target.value.replace(/\D/g,"");e.target.value=d?fmt(+d):""});
$("#bf").onsubmit=async e=>{e.preventDefault();try{await rpc("mr_budget",{p_code:code,p_branch:budB,p_month:month,p_amount:+e.target.amount.value.replace(/\D/g,"")||0});$("#bdg").close();toast("Limit saqlandı");load()}catch(x){toast("Saqlanbadı")}};
function openShare(){
  const base=location.origin+location.pathname;
  const items=[{n:"Barlıq filiallar (ulıwma esabat)",t:D.all_token},...D.branches.map(b=>({n:b.name,t:b.token}))];
  $("#shM").textContent=mname(month)+" esabatı. Filialdı tańlap, siltemesin kóshiriń yamasa Telegram arqalı jiberiń.";
  $("#shL").innerHTML=items.map((it,i)=>{const u=base+"?r="+encodeURIComponent(it.t)+"&m="+month;const txt=it.n+" · marketing rasxodları · "+mname(month);
    return `<div class="s"><b>${esc(it.n)}</b><button class="btn sec sm" data-cp="${esc(u)}">Kóshiriw</button><a class="btn sm" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(txt)}">Telegram</a></div>`}).join("");
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.cp);toast("Silteme kóshirildi")}catch(e){prompt("Siltemeni kóshiriń:",b.dataset.cp)}});
  $("#shd").showModal()}
$("#shX").onclick=()=>$("#shd").close();

async function report(tok,m){
  $("#app").innerHTML='<div class="rep"><p class="mu">Júklenip atır…</p></div>';
  let R;try{R=await rpc("mr_report",{p_token:tok,p_month:m})}catch(e){$("#app").innerHTML='<div class="rep"><p>Esabat tabılmadı yamasa silteme nadurıs.</p></div>';return}
  const bn=Object.fromEntries(R.branches.map(b=>[b.id,b.name])),{by,cat,t}=sums(R.expenses),all=R.scope==="all";
  const budT=Object.values(R.budgets).reduce((a,b)=>a+ +b,0),spB=Object.keys(R.budgets).reduce((a,k)=>a+(by[k]||0),0);
  const nav=k=>location.search="?r="+encodeURIComponent(tok)+"&m="+shift(m,k);
  $("#app").innerHTML=`<div class="rep"><header><div><h1>Marketing rasxodları · ${all?"Barlıq filiallar":esc(bn[R.scope])}</h1>
   <div class="sub">${mname(m)} esabatı · tayarlanǵan sáne ${new Date().toLocaleDateString("ru-RU")}</div></div>
   <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><div class="month"><button id="rp" aria-label="Aldıńǵı ay">‹</button><b>${mname(m)}</b><button id="rn" aria-label="Keyingi ay">›</button></div>
   <button class="btn" onclick="window.print()">PDF / Basıp shıǵarıw</button></div></header>
  <div class="kpis"><div><span>Jumsalǵan</span><b>${fmt(t)} sum</b></div>
   <div><span>Limit</span><b>${budT?fmt(budT)+" sum":"—"}</b></div>
   <div><span>${budT?(spB>budT?"Limitten asqanı":"Limitten qaldıq"):"Rasxodlar sanı"}</span><b>${budT?fmt(Math.abs(budT-spB))+" sum":R.expenses.length}</b></div></div>
  ${all?`<h2>Filiallar boyınsha</h2><div class="tblw"><table><thead><tr><th>Filial</th><th class="r">Jumsalǵan</th><th class="r">Limit</th><th class="r">%</th></tr></thead><tbody>
   ${R.branches.map(b=>{const s=by[b.id]||0,bu=+(R.budgets[b.id]||0);return `<tr><td>${esc(b.name)}</td><td class="r">${fmt(s)}</td><td class="r">${bu?fmt(bu):"—"}</td><td class="r">${bu?Math.round(s/bu*100)+"%":"—"}</td></tr>`}).join("")}
   </tbody><tfoot><tr><td>Jámi</td><td class="r">${fmt(t)}</td><td class="r">${budT?fmt(budT):"—"}</td><td class="r">${budT?Math.round(spB/budT*100)+"%":"—"}</td></tr></tfoot></table></div>`:""}
  <h2>Rasxod túrleri boyınsha</h2><div class="tblw"><table><thead><tr><th>Túri</th><th class="r">Summa</th><th class="r">Úlesi</th></tr></thead><tbody>
   ${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r">${fmt(v)}</td><td class="r">${Math.round(v/t*100)}%</td></tr>`).join("")||'<tr><td colspan="3" class="mu">Rasxod joq</td></tr>'}
   </tbody></table></div>
  <h2>Barlıq rasxodlar</h2><div class="tblw"><table><thead><tr><th>Sáne</th>${all?"<th>Filial</th>":""}<th>Túri</th><th>Eskertiw</th><th class="r">Summa</th></tr></thead><tbody>
   ${R.expenses.map(x=>`<tr><td>${fdate(x.spent_on)}</td>${all?`<td>${esc(bn[x.branch])}</td>`:""}<td>${esc(x.cat)}</td><td>${esc(x.note||"")}</td><td class="r">${fmt(x.amount)}</td></tr>`).join("")||`<tr><td colspan="${all?5:4}" class="mu">Bul ayda rasxod joq</td></tr>`}
   </tbody><tfoot><tr><td colspan="${all?4:3}">Jámi</td><td class="r">${fmt(t)} sum</td></tr></tfoot></table></div></div>`;
  $("#rp").onclick=()=>nav(-1);$("#rn").onclick=()=>nav(1);
}
</script>
</body>
</html>
